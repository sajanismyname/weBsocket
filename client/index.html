<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Socket.IO Rooms</title>

</head>


<body>

    <h1>Socket.IO Rooms</h1>


    <p id="status">
        Connecting...
    </p>


    <p id="socketId">
        Socket ID:
    </p>


    <hr>


    <h3>Join Room</h3>


    <input
        id="usernameInput"
        type="text"
        placeholder="Username"
    >


    <input
        id="roomInput"
        type="text"
        placeholder="Room name"
    >


    <button id="joinButton">
        Join Room
    </button>


    <button id="leaveButton">
        Leave Room
    </button>


    <hr>


    <h3>Send Room Message</h3>


    <input
        id="messageInput"
        type="text"
        placeholder="Message"
    >


    <button id="sendButton">
        Send
    </button>


    <h3>Messages</h3>


    <ul id="messages"></ul>


    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <script src="client.js"></script>

</body>

</html>
