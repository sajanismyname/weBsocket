<!DOCTYPE html>
<html>

<head>
    <title>Socket.IO Private Messaging</title>
    <link rel="icon" href="favicon.ico">
</head>

<body>

    <h1>Private Messaging</h1>

    <p id="mySocketId">
        My Socket ID: Connecting...
    </p>


    <input
        id="receiverInput"
        type="text"
        placeholder="Receiver socket ID"
    >

    <input
        id="messageInput"
        type="text"
        placeholder="Message"
    >

    <button id="sendButton">
        Send Private Message
    </button>


    <h3>Messages</h3>

    <ul id="messages"></ul>


    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <script src="client.js"></script>

</body>

</html>
